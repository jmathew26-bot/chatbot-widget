[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networking-agent"
version = "0.1.0"
description = "Personal networking agent: discovers, verifies, researches, scores, and drafts outreach to high-value professional contacts."
requires-python = ">=3.11"

[project.scripts]
network = "networking_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
