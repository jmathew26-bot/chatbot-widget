scoring:
  weights:
    ut_austin: 25
    career_relevance: 20
    company_quality: 15
    seniority: 10
    geography: 10
    career_interest: 10
    relationship_value: 10
  thresholds:
    exceptional: 90
    high_priority: 80
    good: 70
    review: 60

limits:
  daily_discovery_limit: 25
  daily_email_limit: 10
  default_discover_count: 20

followups:
  max_total_attempts: 3
  followup_1_business_days: 5
  followup_2_business_days_after_followup_1: 8

email:
  min_words: 60
  default_max_words: 130
  hard_max_words: 160
  tone: "intelligent, relaxed, professional, curious, confident, personable, concise"
  banned_phrases:
    - "circle back"
    - "touch base"
    - "pick your brain"
    - "synergy"
    - "just bumping this"
    - "just following up"
    - "hope this email finds you well"

meetings:
  default_duration_minutes: 25
  min_duration_minutes: 20
  max_duration_minutes: 30
  austin_meeting_types: ["coffee", "lunch", "office", "phone", "zoom"]
  remote_meeting_types: ["phone", "zoom"]

autonomous_sending_enabled: false
